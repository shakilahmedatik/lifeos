name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile


      - name: Check code formatting and linting
        run: pnpm check

      - name: Build contracts package
        run: pnpm --filter @lifeos/contracts build

      - name: Typecheck TypeScript packages
        run: pnpm -r exec tsc --noEmit

      - name: Run unit test suites
        run: pnpm -r test
